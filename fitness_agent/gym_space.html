<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espacio del gimnasio</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --text: #1b2029; --muted: #5f6774; --line: #dde1e7; --hover: #eef1f5;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c13d3d; --ok: #2f8a5b; --warn: #b4581c;
    --scene: #dfe3e8; --floor: #c9cdd3; --grid: #b5bac2; --grid-strong: #9aa0aa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1a1d23; --text: #e4e7ec; --muted: #9aa2ae; --line: #2b3038; --hover: #232830;
      --accent: #5b8ff0; --accent-text: #0c1120; --danger: #e46a6a; --ok: #5cc28c; --warn: #f0a052;
      --scene: #16191e; --floor: #5a6069; --grid: #6a717b; --grid-strong: #7f8792;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 600; }
  header label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  header input[type=number] { width: 64px; }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12px; max-width: 48ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  main { display: grid; grid-template-columns: 300px 1fr 310px; min-height: 0; }
  aside { background: var(--panel); overflow-y: auto; padding: 12px 12px 40px; min-height: 0; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }
  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; min-width: 0; }
  input[type=checkbox] { width: auto; }
  .search { width: 100%; margin-bottom: 8px; }
  .machine {
    display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: center; width: 100%; text-align: left;
    border: 1px solid transparent; background: transparent; padding: 4px; border-radius: 8px;
  }
  .machine:hover { background: var(--hover); border-color: var(--line); }
  .machine img { width: 72px; height: 54px; border-radius: 6px; background: var(--hover); display: block; }
  .machine .name { font-weight: 600; }
  .machine .meta { color: var(--muted); font-size: 11.5px; }
  .machine .match { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 99px; background: var(--hover); color: var(--muted); margin-left: 4px; font-weight: 500; }
  .tag.mine { color: var(--accent); }
  .tag.missing { color: var(--warn); }
  details.category > summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: 4px 0; list-style-position: outside; margin-left: 14px; }
  .field { display: block; margin-bottom: 8px; }
  .field > span { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
  .field input, .field select { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 11.5px; }
  .warn { color: var(--warn); }
  .preview { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: var(--hover); display: block; margin-bottom: 8px; }
  .exercises { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .exercise { display: flex; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 4px; }
  .exercise:hover { background: var(--hover); }
  .exercise input { width: auto; flex: none; }
  .exercise img { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; background: #fff; flex: none; }
  .exercise span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .placed { list-style: none; padding: 0; margin: 0; }
  .placed li { padding: 4px 6px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .placed li:hover { background: var(--hover); }
  .placed li.selected { background: var(--hover); outline: 1px solid var(--accent); }
  #view { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--scene); }
  #view canvas { display: block; touch-action: none; }
  #plan { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  .toolbar { z-index: 2; }
  .hint { z-index: 2; }
  .steps { margin: 0 0 10px; padding-left: 18px; }
  .steps li { margin-bottom: 4px; }
  .problem { color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; padding: 6px 8px; font-weight: 600; }
  .rooms { display: grid; gap: 4px; }
  .room { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .room:hover { background: var(--hover); }
  .room.active { border-color: var(--accent); background: var(--hover); }
  .room input:not([type]) { min-width: 0; }
  .room label { display: flex; gap: 3px; align-items: center; white-space: nowrap; }
  .room button { padding: 2px 8px; }
  .swatch.big { width: 16px; height: 16px; margin: 0; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .label {
    pointer-events: none; font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
    background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--text); border: 1px solid var(--line);
  }
  .label.selected { border-color: var(--accent); font-weight: 600; }
  .label.overlap { border-color: var(--warn); }
  .label.axis { background: transparent; border: 0; color: var(--muted); }
  .toolbar {
    position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    background: color-mix(in srgb, var(--panel) 92%, transparent); padding: 6px; border-radius: 8px; border: 1px solid var(--line);
  }
  .toolbar label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  [hidden] { display: none !important; }
  .toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .toolbar button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .toolbar .group { display: flex; gap: 6px; align-items: center; }
  .walls { list-style: none; padding: 0; margin: 0 0 8px; }
  .walls li { padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .walls li:hover { background: var(--hover); }
  .walls li.selected { background: var(--hover); outline: 1px solid var(--accent); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .check { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .check input { width: auto; }
  .door { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: end; margin-bottom: 6px; }
  .label.measure { font-size: 10.5px; padding: 0 4px; color: var(--muted); }
  .hint { position: absolute; bottom: 8px; left: 10px; right: 10px; color: var(--muted); font-size: 11.5px; pointer-events: none; }
  #fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
  @media (max-width: 1100px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    #view { height: 70vh; order: -1; }
    aside { overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>Espacio del gimnasio</h1>
  <select id="gym-select" aria-label="Gimnasio"></select>
  <button id="add-gym" title="Agregar otro gimnasio">+ Gimnasio</button>
  <input id="gym-name" aria-label="Nombre del gimnasio" style="width:170px">
  <span class="spacer"></span>
  <span id="status">Cargando…</span>
  <button id="save" class="primary" disabled>Guardar</button>
</header>
<main>
  <aside class="left">
    <h2>Máquinas de Hevy</h2>
    <input id="search" class="search" type="search" placeholder="Buscar máquina o ejercicio (p. ej. leg press, triceps)">
    <div id="pending"></div>
    <div id="palette"></div>
  </aside>
  <section id="view">
    <div class="toolbar">
      <span class="group">
        <button data-mode="machines" class="active" title="Ubicar y mover máquinas">Máquinas</button>
        <button data-mode="shape" title="Pintar las salas y poner las puertas">Plano: salas y puertas</button>
      </span>
      <span class="sep"></span>
      <span class="group">
        <button id="undo" title="Deshacer (⌘/Ctrl+Z)" disabled>↶</button>
        <button id="redo" title="Rehacer (⇧⌘/Ctrl+Shift+Z)" disabled>↷</button>
      </span>
      <span class="sep"></span>
      <span id="machine-tools" class="group">
        <button id="rotate" title="Girar 90° (R); Shift+R gira 15°">Girar 90°</button>
      </span>
      <span id="shape-tools" class="group" hidden>
        <button data-zone="Máquinas" class="active" title="Arrastrá para dibujar el área de máquinas">Máquinas</button>
        <button data-zone="Recepción" title="Arrastrá para dibujar la recepción (con paredes y puerta)">Recepción</button>
        <button data-tool="erase" title="Arrastrá para quitar: huecos, columnas, rincones">Borrar</button>
        <button data-tool="door" title="Tocá una pared para poner o quitar una puerta">Puerta</button>
      </span>
      <span id="view-tools" class="group">
        <span class="sep"></span>
        <button id="top-view">Vista superior</button>
        <button id="frame">Encuadrar</button>
        <label><input type="checkbox" id="snap" checked> Ajuste 0,1 m</label>
        <label><input type="checkbox" id="labels" checked> Nombres</label>
      </span>
    </div>
    <canvas id="plan" hidden></canvas>
    <div class="hint" id="hint"></div>
    <div id="fallback"><p>No se pudo cargar three.js desde el CDN. El espacio necesita internet para la librería 3D; tus datos siguen solo en este equipo.</p></div>
  </section>
  <aside class="right">
    <div id="machine-panel">
      <h2>Máquina seleccionada</h2>
      <div id="selected"><p class="muted">Seleccioná una máquina en el plano o agregala desde la lista.</p></div>
      <h2>En el plano</h2>
      <ul id="placed" class="placed"></ul>
    </div>
    <div id="shape-panel" hidden></div>
  </aside>
</main>
<script>
  setTimeout(() => { if (!window.__spaceStarted) document.getElementById('fallback').style.display = 'grid'; }, 6000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { buildModel } from './machine_models.js';

window.__spaceStarted = true;
const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
const $ = (selector) => document.querySelector(selector);
const round = (value, digits = 2) => Math.round(value * 10 ** digits) / 10 ** digits;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const DEFAULT_FLOOR = [30, 20];

// =====================================================================
// Estado y datos
// =====================================================================
let state = null;
let inventory = null;
let gymIndex = 0;
let selectedId = null;
let dirty = false;
let mode = 'machines';      // 'machines' | 'shape'
const models = new Map();          // id → { id, name, category, size }
const exercisesByModel = new Map(); // id → [catalog entries]
const catalogById = new Map();
const routineIds = new Set();
const previews = new Map();         // id → dataURL

const gym = () => inventory.gyms[gymIndex];
const stationById = (id) => gym().stations.find((s) => s.id === id);
const modelOf = (station) => models.get(station.model) || models.get('generic');

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  let value;
  for (const [key, val] of Object.entries(attrs)) {
    if (val == null || val === false) continue;
    if (key === 'value') value = val;
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), val);
    else if (key === 'class') el.className = val;
    else if (key === 'checked') el.checked = Boolean(val);
    else el.setAttribute(key, val === true ? '' : val);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : String(child));
  }
  if (value !== undefined) el.value = value;
  return el;
}

function setStatus(text, kind = '') {
  const el = $('#status');
  el.textContent = text;
  el.title = text;
  el.className = kind;
}

async function api(path, body) {
  const response = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Editor-Token': token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({ error: `Respuesta inválida (${response.status}).` }));
  if (!response.ok) throw Object.assign(new Error(data.error || `Error ${response.status}.`), { status: response.status });
  return data;
}

function markDirty() {
  dirty = true;
  $('#save').disabled = false;
  setStatus('Cambios sin guardar');
  recordHistory();
}

// Deshacer/rehacer: copias del inventario entero. Los cambios seguidos en menos de medio segundo (escribir un
// nombre, por ejemplo) cuentan como uno solo.
const edits = { undo: [], redo: [], current: null, at: 0 };
const HISTORY_LIMIT = 100;
function renderHistory() {
  $('#undo').disabled = !edits.undo.length;
  $('#redo').disabled = !edits.redo.length;
}
function resetHistory() {
  edits.undo = [];
  edits.redo = [];
  edits.current = JSON.stringify(inventory);
  renderHistory();
}
function recordHistory() {
  const now = JSON.stringify(inventory);
  if (edits.current === null || now === edits.current) return;
  const time = Date.now();
  if (!(time - edits.at < 500 && edits.undo.length)) {
    edits.undo.push(edits.current);
    if (edits.undo.length > HISTORY_LIMIT) edits.undo.shift();
  }
  edits.at = time;
  edits.current = now;
  edits.redo = [];
  renderHistory();
}
function travel(from, to) {
  if (!from.length) return;
  stroke = null;
  to.push(edits.current);
  edits.current = from.pop();
  edits.at = 0;
  inventory = JSON.parse(edits.current);
  gymIndex = Math.min(gymIndex, inventory.gyms.length - 1);
  dirty = true;
  $('#save').disabled = false;
  setStatus('Cambios sin guardar');
  switchGym(gymIndex, false);
  renderHistory();
}
const undo = () => travel(edits.undo, edits.redo);
const redo = () => travel(edits.redo, edits.undo);

function uniqueId(taken) {
  let n = taken.length + 1;
  while (taken.includes(`estacion-${n}`)) n += 1;
  return `estacion-${n}`;
}

// =====================================================================
// Geometría del plano: contorno, secciones, paredes y puertas (misma que layout.py)
// =====================================================================
const rectOutline = ([w, d]) => [[0, 0], [w, 0], [w, d], [0, d]];
const layout = () => gym().layout || { outline: rectOutline((gym().settings && gym().settings.floor) || DEFAULT_FLOOR), walls: [] };
function bounds() {
  const xs = layout().outline.map((p) => p[0]);
  const zs = layout().outline.map((p) => p[1]);
  return { x0: Math.min(...xs), x1: Math.max(...xs), z0: Math.min(...zs), z1: Math.max(...zs) };
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function orient(a, b, c) {
  const v = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  return Math.abs(v) < 1e-9 ? 0 : Math.sign(v);
}
function onSegment(a, b, c) {
  return Math.min(a[0], b[0]) - 1e-9 <= c[0] && c[0] <= Math.max(a[0], b[0]) + 1e-9
    && Math.min(a[1], b[1]) - 1e-9 <= c[1] && c[1] <= Math.max(a[1], b[1]) + 1e-9;
}
function segmentsCross(p1, p2, q1, q2) {
  const o1 = orient(p1, p2, q1); const o2 = orient(p1, p2, q2); const o3 = orient(q1, q2, p1); const o4 = orient(q1, q2, p2);
  if (o1 !== o2 && o3 !== o4) return true;
  return (o1 === 0 && onSegment(p1, p2, q1)) || (o2 === 0 && onSegment(p1, p2, q2))
    || (o3 === 0 && onSegment(q1, q2, p1)) || (o4 === 0 && onSegment(q1, q2, p2));
}
function pointInPolygon([x, z], polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i, i += 1) {
    const [xi, zi] = polygon[i];
    const [xj, zj] = polygon[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
const edgesOf = (polygon) => polygon.map((p, i) => [p, polygon[(i + 1) % polygon.length]]);
function polygonArea(polygon) {
  return Math.abs(edgesOf(polygon).reduce((sum, [a, b]) => sum + a[0] * b[1] - b[0] * a[1], 0)) / 2;
}
const wallLength = (wall) => dist(wall.from, wall.to);
function wallPieces(wall) {
  const length = wallLength(wall);
  const ux = (wall.to[0] - wall.from[0]) / length; const uz = (wall.to[1] - wall.from[1]) / length;
  const at = (t) => [wall.from[0] + ux * t, wall.from[1] + uz * t];
  const cuts = (wall.doors || []).map((d) => [d.offset - d.width / 2, d.offset + d.width / 2]).sort((a, b) => a[0] - b[0]);
  const pieces = [];
  let cursor = 0;
  for (const [a, b] of [...cuts, [length, length]]) {
    if (a - cursor > 1e-9) pieces.push([at(cursor), at(a)]);
    cursor = Math.max(cursor, b);
  }
  return pieces;
}
const SECTION_COLORS = [0x4f86e8, 0xe0873a, 0x3fa37a, 0xb05fc9, 0xd4b13a, 0xd25b6e, 0x46a9c2, 0x8d9a3c];
const sectionColor = (index) => SECTION_COLORS[index % SECTION_COLORS.length];
function sectionEdges(section) {
  const polygon = section.outline;
  return polygon.map((a, i) => ({
    from: a, to: polygon[(i + 1) % polygon.length], section: section.id, edge: i,
    doors: (section.doors || []).filter((d) => d.edge === i),
  }));
}
function allWalls() {
  // Paredes que bloquean: las sueltas y los bordes de las secciones con muros (igual que layout.all_walls).
  const { walls = [], sections = [] } = layout();
  return [...walls, ...sections.filter((sec) => sec.walled !== false).flatMap(sectionEdges)];
}
const wallSegments = () => allWalls().flatMap(wallPieces);
function sectionAt(point) {
  const found = (layout().sections || []).filter((sec) => pointInPolygon(point, sec.outline));
  return found.sort((a, b) => polygonArea(a.outline) - polygonArea(b.outline))[0] || null;
}
function centroid(polygon) {
  let area = 0; let cx = 0; let cz = 0;
  for (const [a, b] of edgesOf(polygon)) {
    const cross = a[0] * b[1] - b[0] * a[1];
    area += cross; cx += (a[0] + b[0]) * cross; cz += (a[1] + b[1]) * cross;
  }
  if (Math.abs(area) < 1e-9) return polygon[0];
  return [cx / (3 * area), cz / (3 * area)];
}
function footprintCorners(position, rotation, size) {
  const [w, , d] = size;
  const angle = THREE.MathUtils.degToRad(rotation || 0);
  const cos = Math.cos(angle); const sin = Math.sin(angle);
  return [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]]
    .map(([x, z]) => [position[0] + x * cos + z * sin, position[2] - x * sin + z * cos]);
}
function placementProblems(position, rotation, size) {
  const corners = footprintCorners(position, rotation, size);
  const outline = layout().outline;
  const outside = corners.some((c) => !pointInPolygon(c, outline))
    || edgesOf(corners).some(([a, b]) => edgesOf(outline).some(([p, q]) => segmentsCross(a, b, p, q)));
  const wall = wallSegments().some(([p, q]) => pointInPolygon(p, corners) || pointInPolygon(q, corners)
    || edgesOf(corners).some(([a, b]) => segmentsCross(a, b, p, q)));
  return { outside, wall };
}
function issues() {
  const result = new Map();
  const add = (id, message) => result.set(id, [...(result.get(id) || []), message]);
  for (const [id, names] of overlaps()) add(id, `se superpone con ${names.join(', ')}`);
  for (const station of gym().stations) {
    if (!station.position) continue;
    const problems = placementProblems(station.position, station.rotation_deg, modelOf(station).size);
    if (problems.outside) add(station.id, 'queda fuera de la forma del gimnasio');
    if (problems.wall) add(station.id, 'atraviesa una pared');
  }
  return result;
}

const view = $('#view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
view.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = 'labels';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.maxPolarAngle = Math.PI / 2 - 0.03;

scene.add(new THREE.HemisphereLight(0xffffff, 0x80889a, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(20, 35, 25);
scene.add(sun);
const floorGroup = new THREE.Group();
scene.add(floorGroup);
const placedObjects = new Map(); // id → { group, model, footprint, label, el }
const footprintMaterial = () => new THREE.MeshBasicMaterial({ color: 0x2f6fde, transparent: true, opacity: 0, depthWrite: false });

const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);
const LAYOUT_MAT = {
  wall: new THREE.MeshStandardMaterial({ color: 0xd8d2c7, roughness: 0.9, transparent: true, opacity: 0.6, depthWrite: false }),
  curb: new THREE.MeshStandardMaterial({ color: 0x8f949c, roughness: 0.9 }),
  door: new THREE.MeshStandardMaterial({ color: 0x3f9d6b, roughness: 0.7 }),
  openEdge: new THREE.LineDashedMaterial({ color: 0x9aa0aa, dashSize: 0.3, gapSize: 0.2 }),
};
const SHARED = new Set([UNIT_BOX, ...Object.values(LAYOUT_MAT)]);
const WALL_HEIGHT = 2.4;
const WALL_THICKNESS = 0.12;

function clearGroup(group) {
  for (const child of [...group.children]) {
    group.remove(child);
    child.traverse((node) => {
      if (node.geometry && !SHARED.has(node.geometry)) node.geometry.dispose();
      if (node.material && !SHARED.has(node.material)) node.material.dispose();
    });
  }
}

function segmentBox(a, b, height, thickness, material, data, y = height / 2) {
  const length = dist(a, b);
  if (length < 1e-3) return null;
  const mesh = new THREE.Mesh(UNIT_BOX, material);
  mesh.scale.set(length, height, thickness);
  mesh.position.set((a[0] + b[0]) / 2, y, (a[1] + b[1]) / 2);
  mesh.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]);
  Object.assign(mesh.userData, data);
  floorGroup.add(mesh);
  return mesh;
}

function gridInside(outline, axis, value) {
  // Tramos de la recta x=value (axis 0) o z=value (axis 1) dentro del contorno.
  const other = 1 - axis;
  const hits = [];
  for (const [a, b] of edgesOf(outline)) {
    if ((a[axis] <= value) !== (b[axis] <= value)) {
      hits.push(a[other] + ((value - a[axis]) * (b[other] - a[other])) / (b[axis] - a[axis]));
    }
  }
  hits.sort((x, y) => x - y);
  const spans = [];
  for (let i = 0; i + 1 < hits.length; i += 2) spans.push([hits[i], hits[i + 1]]);
  return spans;
}

function buildLayout() {
  clearGroup(floorGroup);
  scene.background = new THREE.Color(css('--scene'));
  const { outline, walls = [] } = layout();
  const shape = new THREE.Shape(outline.map(([x, z]) => new THREE.Vector2(x, -z)));
  const plane = new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshStandardMaterial({ color: css('--floor'), roughness: 0.95, side: THREE.DoubleSide }));
  plane.rotation.x = -Math.PI / 2;
  floorGroup.add(plane);
  const b = bounds();
  const thin = [];
  const strong = [];
  for (let x = Math.ceil(b.x0); x <= b.x1 + 1e-6; x += 1) {
    for (const [z0, z1] of gridInside(outline, 0, x + 1e-4)) (x % 5 === 0 ? strong : thin).push(x, 0.004, z0, x, 0.004, z1);
  }
  for (let z = Math.ceil(b.z0); z <= b.z1 + 1e-6; z += 1) {
    for (const [x0, x1] of gridInside(outline, 1, z + 1e-4)) (z % 5 === 0 ? strong : thin).push(x0, 0.004, z, x1, 0.004, z);
  }
  for (const [points, color] of [[thin, css('--grid')], [strong, css('--grid-strong')]]) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
    floorGroup.add(new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color })));
  }
  edgesOf(outline).forEach(([a, c], i) => segmentBox(a, c, 0.15, 0.15, LAYOUT_MAT.curb, { edge: i }));
  const renderWall = (wall, data) => {
    const material = LAYOUT_MAT.wall;
    for (const [a, c] of wallPieces(wall)) segmentBox(a, c, WALL_HEIGHT, WALL_THICKNESS, material, data);
    const length = wallLength(wall);
    const u = [(wall.to[0] - wall.from[0]) / length, (wall.to[1] - wall.from[1]) / length];
    for (const door of wall.doors || []) {
      const a = [wall.from[0] + u[0] * (door.offset - door.width / 2), wall.from[1] + u[1] * (door.offset - door.width / 2)];
      const c = [wall.from[0] + u[0] * (door.offset + door.width / 2), wall.from[1] + u[1] * (door.offset + door.width / 2)];
      segmentBox(a, c, 0.3, WALL_THICKNESS, material, data, WALL_HEIGHT - 0.15);
      segmentBox(a, c, 0.02, 0.6, LAYOUT_MAT.door, data, 0.012);
    }
  };
  // Con plano de casillas el color de cada sección es el de su sala.
  const grid = layout().grid;
  const colorOf = (section, index) => sectionColor(grid && section.room ? Math.max(0, grid.rooms.findIndex((r) => r.key === section.room)) : index);
  (layout().sections || []).forEach((section, index) => {
    const color = colorOf(section, index);
    const fill = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(section.outline.map(([x, z]) => new THREE.Vector2(x, -z)))),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide }));
    fill.rotation.x = -Math.PI / 2;
    fill.position.y = 0.006 + index * 0.0005;
    fill.userData.sectionId = section.id;
    floorGroup.add(fill);
    const [cx, cz] = centroid(section.outline);
    const name = new CSS2DObject(h('div', { class: 'label', style: `border-left:4px solid #${color.toString(16).padStart(6, '0')}` },
      section.name + (section.walled === false && !grid ? ' · abierta' : '')));
    name.position.set(cx, 0.05, cz);
    floorGroup.add(name);
    if (section.walled !== false) for (const edge of sectionEdges(section)) renderWall(edge, { sectionId: section.id, edge: edge.edge });
    else if (!grid) {
      const points = [...section.outline, section.outline[0]].map(([x, z]) => new THREE.Vector3(x, 0.02, z));
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), LAYOUT_MAT.openEdge);
      line.computeLineDistances();
      floorGroup.add(line);
    }
  });
  for (const wall of walls) renderWall(wall, { wallId: wall.id });
  // Casillas borradas dentro del gimnasio (columnas, huecos): se ven como hueco en el piso, rodeado de pared.
  if (grid) {
    const outside = outsideOf(grid, (c, r) => cellAt(grid, c, r) !== EMPTY);
    const hole = (c, r) => cellAt(grid, c, r) === EMPTY && !outside.has(`${c},${r}`);
    const cover = new THREE.MeshBasicMaterial({ color: css('--scene'), side: THREE.DoubleSide });
    for (let r = 0; r < grid.rows; r += 1) {
      for (let c = 0; c < grid.cols; c += 1) {
        if (!hole(c, r)) continue;
        const patch = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), cover);
        patch.rotation.x = -Math.PI / 2;
        patch.position.set((c + 0.5) * CELL, 0.01, (r + 0.5) * CELL);
        floorGroup.add(patch);
        const x0 = c * CELL; const x1 = x0 + CELL; const z0 = r * CELL; const z1 = z0 + CELL;
        if (!hole(c, r - 1)) segmentBox([x0, z0], [x1, z0], WALL_HEIGHT, WALL_THICKNESS, LAYOUT_MAT.wall, {});
        if (!hole(c, r + 1)) segmentBox([x0, z1], [x1, z1], WALL_HEIGHT, WALL_THICKNESS, LAYOUT_MAT.wall, {});
        if (!hole(c - 1, r)) segmentBox([x0, z0], [x0, z1], WALL_HEIGHT, WALL_THICKNESS, LAYOUT_MAT.wall, {});
        if (!hole(c + 1, r)) segmentBox([x1, z0], [x1, z1], WALL_HEIGHT, WALL_THICKNESS, LAYOUT_MAT.wall, {});
      }
    }
  }
}

function frame(top = false) {
  // Distancia para que entren el ancho y el fondo con la proporción actual de la vista.
  const b = bounds();
  const cx = (b.x0 + b.x1) / 2;
  const cz = (b.z0 + b.z1) / 2;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fit = Math.max((b.z1 - b.z0) / 2 / tan, (b.x1 - b.x0) / 2 / (tan * camera.aspect)) * 1.12;
  orbit.target.set(cx, 0, cz);
  if (top) camera.position.set(cx, fit + 2, cz + 0.01);
  else camera.position.copy(orbit.target).addScaledVector(new THREE.Vector3(0, 0.62, 0.78).normalize(), fit * 1.2);
  orbit.update();
}

function footprintBox(station) {
  const [w, , d] = modelOf(station).size;
  const angle = THREE.MathUtils.degToRad(station.rotation_deg || 0);
  const halfW = (Math.abs(w * Math.cos(angle)) + Math.abs(d * Math.sin(angle))) / 2;
  const halfD = (Math.abs(w * Math.sin(angle)) + Math.abs(d * Math.cos(angle))) / 2;
  const [x, , z] = station.position;
  return { x0: x - halfW, x1: x + halfW, z0: z - halfD, z1: z + halfD };
}

function overlaps() {
  const placed = gym().stations.filter((s) => s.position);
  const boxes = placed.map(footprintBox);
  const result = new Map();
  for (let i = 0; i < placed.length; i += 1) {
    for (let j = i + 1; j < placed.length; j += 1) {
      const a = boxes[i];
      const b = boxes[j];
      if (a.x0 < b.x1 - 0.05 && b.x0 < a.x1 - 0.05 && a.z0 < b.z1 - 0.05 && b.z0 < a.z1 - 0.05) {
        for (const [s, other] of [[placed[i], placed[j]], [placed[j], placed[i]]]) {
          result.set(s.id, [...(result.get(s.id) || []), other.name]);
        }
      }
    }
  }
  return result;
}

function syncScene() {
  const present = new Set();
  const crossing = issues();
  for (const station of gym().stations) {
    if (!station.position) continue;
    present.add(station.id);
    let entry = placedObjects.get(station.id);
    const modelId = modelOf(station).id;
    if (entry && entry.model !== modelId) {
      scene.remove(entry.group, entry.label);
      placedObjects.delete(station.id);
      entry = null;
    }
    if (!entry) {
      const group = new THREE.Group();
      group.add(buildModel(modelId));
      const [w, , d] = modelOf(station).size;
      const footprint = new THREE.Mesh(new THREE.PlaneGeometry(w, d), footprintMaterial());
      footprint.rotation.x = -Math.PI / 2;
      footprint.position.y = 0.01;
      group.add(footprint);
      group.traverse((node) => { node.userData.stationId = station.id; });
      const el = h('div', { class: 'label' });
      const label = new CSS2DObject(el);
      scene.add(group, label);
      entry = { group, model: modelId, footprint, label, el };
      placedObjects.set(station.id, entry);
    }
    const [x, y, z] = station.position;
    entry.group.position.set(x, y, z);
    entry.group.rotation.y = THREE.MathUtils.degToRad(station.rotation_deg || 0);
    const selected = station.id === selectedId;
    const crossed = crossing.has(station.id);
    entry.footprint.material.color.set(crossed ? 0xe08a2e : 0x2f6fde);
    entry.footprint.material.opacity = selected ? 0.35 : (crossed ? 0.3 : 0);
    entry.label.position.set(x, y + modelOf(station).size[1] + 0.25, z);
    entry.label.visible = $('#labels').checked || selected;
    entry.el.textContent = station.name;
    entry.el.classList.toggle('selected', selected);
    entry.el.classList.toggle('overlap', crossed);
  }
  for (const [id, entry] of placedObjects) {
    if (present.has(id)) continue;
    scene.remove(entry.group, entry.label);
    entry.footprint.geometry.dispose();
    entry.footprint.material.dispose();
    placedObjects.delete(id);
  }
  return crossing;
}

function renderPreviews() {
  const size = [192, 144];
  const offscreen = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  offscreen.setSize(size[0], size[1]);
  const previewScene = new THREE.Scene();
  previewScene.background = new THREE.Color(0xdde1e6);
  previewScene.add(new THREE.HemisphereLight(0xffffff, 0x80889a, 1.6));
  const light = new THREE.DirectionalLight(0xffffff, 2.4);
  light.position.set(3, 5, 4);
  previewScene.add(light);
  const previewCamera = new THREE.PerspectiveCamera(32, size[0] / size[1], 0.05, 50);
  for (const model of models.values()) {
    const group = buildModel(model.id);
    previewScene.add(group);
    const bounds = new THREE.Box3().setFromObject(group);
    const center = bounds.getCenter(new THREE.Vector3());
    const radius = bounds.getSize(new THREE.Vector3()).length() / 2;
    const distance = radius / Math.sin(THREE.MathUtils.degToRad(previewCamera.fov / 2)) * 0.95;
    previewCamera.position.copy(center).add(new THREE.Vector3(0.75, 0.55, 1).normalize().multiplyScalar(distance));
    previewCamera.lookAt(center);
    offscreen.render(previewScene, previewCamera);
    previews.set(model.id, offscreen.domElement.toDataURL('image/png'));
    previewScene.remove(group);
  }
  offscreen.dispose();
}

function placedCount(modelId) {
  return gym().stations.filter((s) => s.position && modelOf(s).id === modelId).length;
}

function modelsInRoutines() {
  const result = new Set();
  for (const id of routineIds) {
    const entry = catalogById.get(id);
    if (entry) result.add(entry.model);
  }
  return result;
}

function renderPalette() {
  const query = $('#search').value.trim().toLowerCase();
  const words = query.split(/\s+/).filter(Boolean);
  const mine = modelsInRoutines();
  const container = $('#palette');
  container.replaceChildren();
  for (const category of state.categories) {
    const items = [];
    for (const model of models.values()) {
      if (model.category !== category) continue;
      const exercises = exercisesByModel.get(model.id) || [];
      const nameMatch = words.every((w) => model.name.toLowerCase().includes(w));
      const matches = nameMatch ? [] : exercises.filter((e) => words.every((w) => e.title.toLowerCase().includes(w)));
      if (words.length && !nameMatch && !matches.length) continue;
      const count = placedCount(model.id);
      items.push(h('button', {
        class: 'machine', type: 'button', title: `Agregar ${model.name} al plano`,
        onclick: () => addMachine(model.id),
      },
      h('img', { src: previews.get(model.id) || '', alt: '' }),
      h('div', {},
        h('div', { class: 'name' }, model.name),
        h('div', { class: 'meta' }, `${exercises.length} ejercicio${exercises.length === 1 ? '' : 's'} de Hevy`,
          mine.has(model.id) ? h('span', { class: count ? 'tag mine' : 'tag missing' }, count ? 'en tus rutinas' : 'falta ubicar') : null,
          count ? h('span', { class: 'tag' }, `×${count}`) : null),
        matches.length ? h('div', { class: 'match' }, matches.slice(0, 3).map((e) => e.title).join(' · ')) : null)));
    }
    if (!items.length) continue;
    const details = h('details', { class: 'category', open: true }, h('summary', {}, `${category} (${items.length})`), ...items);
    container.append(details);
  }
  if (!container.children.length) container.append(h('p', { class: 'muted' }, 'Ninguna máquina coincide con la búsqueda.'));
}

function pendingGroups() {
  const groups = new Map();
  for (const station of gym().stations) {
    if (station.position) continue;
    const key = modelOf(station).id;
    groups.set(key, [...(groups.get(key) || []), station]);
  }
  return groups;
}

function renderPending() {
  const groups = pendingGroups();
  const container = $('#pending');
  if (!groups.size) { container.replaceChildren(); return; }
  container.replaceChildren(
    h('h2', {}, 'Sin ubicar de tus rutinas'),
    h('p', { class: 'muted small' }, 'Estaciones que ya estaban en el inventario. Al ubicarlas se unen las que usan la misma máquina.'),
    ...[...groups].map(([modelId, stations]) => h('button', {
      class: 'machine', type: 'button', onclick: () => placePending(modelId),
    },
    h('img', { src: previews.get(modelId) || '', alt: '' }),
    h('div', {},
      h('div', { class: 'name' }, models.get(modelId).name),
      h('div', { class: 'match' }, stations.map((s) => s.name).join(' · '))))),
  );
}

function renderPlaced() {
  const crossing = issues();
  const items = gym().stations.filter((s) => s.position).map((station) => h('li', {
    class: station.id === selectedId ? 'selected' : '', onclick: () => select(station.id, true),
    title: (crossing.get(station.id) || []).join('; '),
  }, h('span', {}, station.name), crossing.has(station.id) ? h('span', { class: 'warn small' }, 'revisar') : null));
  $('#placed').replaceChildren(...(items.length ? items : [h('li', { class: 'muted' }, 'Todavía no hay máquinas en el plano.')]));

function exerciseRow(station, entry, checked) {
  return h('label', { class: 'exercise' },
    h('input', {
      type: 'checkbox', checked,
      onchange: (event) => {
        const ids = new Set(station.exercise_template_ids);
        if (event.target.checked) ids.add(entry.id); else ids.delete(entry.id);
        station.exercise_template_ids = [...ids];
        renderSelected();
        renderPalette();
        markDirty();
      },
    }),
    entry.thumbnail_url ? h('img', { src: entry.thumbnail_url, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : null,
    h('span', { title: entry.title }, entry.title),
    routineIds.has(entry.id) ? h('span', { class: 'tag mine', style: 'flex:none' }, 'rutina') : null);
